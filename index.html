<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Palette | Krishna Priya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mood-card">
        <h1>Mood Palette</h1>
        <p class="subtitle">Enter your name and mood below</p>
        
        <div class="input-group">
            <input type="text" id="user-name" placeholder="Your Name">
            <input type="text" id="mood-input" placeholder="How do you feel?">
            <button id="generate-btn">Generate</button>
        </div>
        
        <div id="output-area">
            <p id="affirmation"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
